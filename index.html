<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Developer Workshop Registration</title>
</head>

<body>

    <div class="form-container">
        <h1>Developer Workshop Registration</h1>

        <form id="registration-form">

            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="experience">Experience Level</label>
                <select id="experience" name="experience">
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
            </div>

            <div class="form-group">
                <label>Workshop Track</label>
                <div class="radio-group-wrapper">
                    <label class="radio-label">
                        <input type="radio" name="track" value="frontend"> Frontend Web
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="track" value="backend"> Backend APIs
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="track" value="uiux"> UI/UX Design
                    </label>
                </div>
            </div>

            <div class="form-group checkbox-container">
                <input type="checkbox" id="notifications" name="notifications">
                <label for="notifications">I agree to receive event updates</label>
            </div>

            <div class="form-group">
                <button type="submit">Register Now</button>
            </div>

        </form>
    </div>

</body>

</html>
